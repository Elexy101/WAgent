use_default_settings: true

server:
  secret_key: "voicereply-local-development-only"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  safe_search: 0

outgoing:
  request_timeout: 12.0
  max_request_timeout: 20.0
  pool_connections: 20
  pool_maxsize: 20

engines:
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
  - name: mojeek
    disabled: false
